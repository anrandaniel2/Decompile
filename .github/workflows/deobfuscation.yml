name: Static Luau reconstruction
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tree-sitter==0.25.2 tree-sitter-luau==1.2.0
      - name: Build upstream Luau VM and compiler for offline differential checks
        run: |
          git clone --depth 1 --branch 0.745 https://github.com/luau-lang/luau.git /tmp/luau
          make -C /tmp/luau -j2 config=release luau luau-compile
      # Executes ONLY extracted decoder, guard/bootstrap, and pure helpers; never the Roblox body.
      - name: Differentially validate original decoder and readable reconstruction
        run: python tools/validate_hybrid.py --luau /tmp/luau/build/release/luau
      - run: python -m unittest discover -s tests -v
      - name: Compile reconstructed Luau without executing the game script
        run: /tmp/luau/build/release/luau-compile --null cheesy.deobfuscated.luau
