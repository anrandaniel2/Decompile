name: Static Luau reconstruction
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tree-sitter==0.25.2 tree-sitter-luau==1.2.0
      - run: python -m unittest discover -s tests -v
